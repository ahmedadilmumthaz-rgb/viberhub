version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: viberhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    networks:
      - viberhub-network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: viberhub-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://api:4000
    depends_on:
      - api
    networks:
      - viberhub-network

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: viberhub-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-viberhub}:${POSTGRES_PASSWORD:-viberhub_password}@postgres:5432/${POSTGRES_DB:-viberhub}?schema=public
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - STORAGE_PROVIDER=r2storage
      - R2_ENDPOINT=${R2_ENDPOINT:-https://panel.mvcdn.cc/s3}
      - R2_ADMIN_ENDPOINT=${R2_ADMIN_ENDPOINT:-https://panel.mvcdn.cc/api/admin}
      - R2_BUCKET=${R2_BUCKET:-viberhub}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-r2_f8ebdadacbe468df3403bc4a}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-18d35935c59172763d955fc37b12fe3cd15af768b02f04f3}
      - R2_ADMIN_SECRET=${R2_ADMIN_SECRET:-3062763f681b116f7d20da1f47ce84e9aae649d66aef3515d9d58cc37766a875}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - viberhub-network

  postgres:
    image: postgres:16-alpine
    container_name: viberhub-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-viberhub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-viberhub_password}
      - POSTGRES_DB=${POSTGRES_DB:-viberhub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viberhub} -d ${POSTGRES_DB:-viberhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - viberhub-network

  redis:
    image: redis:7-alpine
    container_name: viberhub-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - viberhub-network

networks:
  viberhub-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
